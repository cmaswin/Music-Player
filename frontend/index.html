<!DOCTYPE html>
<html>
<head>
  <title>My Music Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2 class="logo">MySpotify</h2>
    <ul>
      <li><i class="fa-solid fa-house"></i> Home</li>
    </ul>
  </div>

  <!-- Main -->
  <div class="main">
    <h1>All Songs</h1>

    <!-- Loader -->
    <div id="loader" class="loader">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <p>Loading songs...</p>
    </div>

    <!-- Songs -->
    <div id="songList" class="song-container"></div>
  </div>

</div>

<!-- ================= PLAYER MODAL ================= -->
<div id="playerModal" class="modal">
  <div class="modal-content new-player">

    <span class="close" onclick="closeModal()">
      <i class="fa-solid fa-xmark"></i>
    </span>

    <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png"
         class="music-icon big-cover">

    <h2 id="modalSongName" class="song-title">Song Name</h2>
    <p class="artist-name">Unknown Artist</p>

    <audio id="audioPlayer"></audio>

    <!-- Time -->
    <div class="time-container">
      <span id="currentTime">0:00</span>
      <input type="range" id="progressBar" value="0">
      <span id="duration">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls modern-controls">
      <button onclick="prevSong()">
        <i class="fa-solid fa-backward-step"></i>
      </button>

      <button onclick="playPause()" class="play-btn big-play">
        <i class="fa-solid fa-play" id="playIcon"></i>
      </button>

      <button onclick="nextSong()">
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-container">
      <i class="fa-solid fa-volume-low"></i>
      <input type="range" id="volumeBar" min="0" max="1"
             step="0.01" value="1">
      <i class="fa-solid fa-volume-high"></i>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
